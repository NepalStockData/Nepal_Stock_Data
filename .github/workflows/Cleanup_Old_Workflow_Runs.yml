name: Cleanup Old Workflow Runs

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
    # Runs on the 15th of every month at 00:00 UTC
    - cron: "0 0 15 * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup-old-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup workflow runs older than 30 days
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
            console.log(`Deleting workflow runs created on or before ${cutoff}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let deleted = 0;
            let skipped = 0;

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );

            const oldRuns = allRuns.filter(run => new Date(run.created_at) <= new Date(cutoff));
            console.log(`Found ${oldRuns.length} workflow run(s) older than 30 days.`);
            if (oldRuns.length === 0) {
              console.log('No workflow runs to delete.');
            }

            for (const run of oldRuns) {
              try {
                console.log(`Deleting run #${run.id} (workflow: ${run.name ?? run.workflow_id}, created: ${run.created_at})`);
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted += 1;
              } catch (error) {
                console.warn(`Failed to delete run #${run.id}: ${error.message}`);
                skipped += 1;
              }
            }

            console.log(`Cleanup complete: ${deleted} run(s) deleted, ${skipped} run(s) skipped.`);
